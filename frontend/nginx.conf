server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The UI and the API share one origin, so no CORS setup is needed.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;          # keeps the agent's event stream live
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
